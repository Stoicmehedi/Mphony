<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{color-scheme:light dark}
  body{width:260px;margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fbf9f4;color:#211c17}
  @media (prefers-color-scheme:dark){body{background:#1a1713;color:#f0e9df}}
  .pad{padding:16px 16px 18px}
  h1{font-size:16px;margin:0 0 2px;font-weight:700}
  .sub{font-size:12px;color:#6f655a;margin:0 0 14px}
  @media (prefers-color-scheme:dark){.sub{color:#a79a8b}}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
  label{font-size:13.5px;font-weight:600}
  input[type=text]{width:120px;font:600 13px ui-monospace,monospace;padding:6px 8px;border:1px solid #ddd4c6;border-radius:7px;background:#fff;color:#2f6f6a}
  @media (prefers-color-scheme:dark){input[type=text]{background:#241f1a;border-color:#39322a;color:#6fc0b8}}
  .sw{position:relative;width:42px;height:24px;flex:none}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .track{position:absolute;inset:0;background:#ccc3b4;border-radius:999px;transition:.15s;pointer-events:none}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
  .sw input:checked + .track{background:#2f6f6a}
  .sw input:checked + .track::after{transform:translateX(18px)}
  .tip{font-size:12px;line-height:1.5;color:#6f655a;border-top:1px solid #ddd4c6;margin-top:14px;padding-top:12px}
  @media (prefers-color-scheme:dark){.tip{color:#a79a8b;border-color:#39322a}}
  .tip b{color:#9d2b3a}
  @media (prefers-color-scheme:dark){.tip b{color:#e4707d}}
  kbd{font:600 11px ui-monospace,monospace;background:#efe9dd;border:1px solid #ddd4c6;border-radius:4px;padding:1px 5px}
  @media (prefers-color-scheme:dark){kbd{background:#2b251f;border-color:#39322a}}
</style>
</head>
<body>
  <div class="pad">
    <h1>Mphony</h1>
    <p class="sub">English → Bangla, on a trigger word.</p>

    <div class="row">
      <label for="enabled">Enabled</label>
      <label class="sw"><input type="checkbox" id="enabled" checked><span class="track"></span></label>
    </div>

    <div class="row">
      <label for="debug">Debug bar</label>
      <label class="sw"><input type="checkbox" id="debug"><span class="track"></span></label>
    </div>

    <p class="tip">
      Type normally in English. Press <kbd>Ctrl</kbd>+<kbd>Space</kbd> in any text box to
      switch to Bangla (Avro phonetic); press it again to switch back to English.
    </p>
    <p class="tip" style="border-top:none;margin-top:0;padding-top:0">
      Developed by <b>Md Mehedi Hasan</b> · stoicmehedi@gmail.com
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
